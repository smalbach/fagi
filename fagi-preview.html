<!doctype html><meta charset="utf-8"><title>fagi preview</title>
<body style="margin:0;background:#222630">
<canvas id="c" width="1180" height="620"></canvas>
<script type="module">
import { drawFagi } from '/src/fagi-sprite.js';

const ctx = document.getElementById('c').getContext('2d');

// A fake Fagi: only what the drawing asks her for.
function fagi(x, y, angle, extra = {}) {
  return { x, y, angle, alive: true, stride: 0, targetKind: null, castSide: 1,
    carrying: null, ...extra };
}

function critter(f, scaleOf, t) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(scaleOf, scaleOf);
  ctx.translate(-f.x, -f.y);
  drawFagi(ctx, { ...f, stride: f.alive ? t * 9 : 0 });
  ctx.restore();
}

function frame(ms) {
  const t = ms / 1000;
  ctx.fillStyle = '#3a342a'; ctx.fillRect(0, 0, 1180, 620);   // background soil

  // Big, to look at her chitin.
  critter(fagi(230, 200, 0), 6, t);
  // Turning: the light has to stay fixed in the world.
  for (let i = 0; i < 6; i++) {
    critter(fagi(600 + (i % 3) * 160, 130 + ((i / 3) | 0) * 150, (i / 6) * Math.PI * 2), 2.4, t);
  }
  // Carrying, dead, and tracking a scent.
  critter(fagi(180, 470, -0.6, { carrying: { type: 'nectar' } }), 3.4, t);
  critter(fagi(420, 470, 0.9, { alive: false }), 3.4, t);
  critter(fagi(680, 470, 0.2, { targetKind: 'scent', castSide: 1 }), 3.4, t);
  // And at real size, which is how she looks on the map.
  critter(fagi(950, 470, 0.2), 1, t);
  critter(fagi(1010, 470, 2.4), 1, t);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
