<!doctype html><meta charset="utf-8"><title>fagi preview</title>
<body style="margin:0;background:#222630;font:12px system-ui,sans-serif;color:#cfd3dc">
<canvas id="c" width="1180" height="700" style="width:100%"></canvas>
<script type="module">
import { drawFagi } from '/src/fagi-sprite.js';

const ctx = document.getElementById('c').getContext('2d');

// The game's own forest floor behind her: realism is judged against the
// ground she walks on, not a flat color.
const floor = new Image();
floor.src = '/assets/forest-floor.webp';
function ground() {
  if (floor.complete && floor.naturalWidth) {
    ctx.fillStyle = ctx.createPattern(floor, 'repeat');
    ctx.fillRect(0, 0, 1180, 700);
  } else {
    ctx.fillStyle = '#3a342a'; ctx.fillRect(0, 0, 1180, 700);
  }
}

// A fake Fagi: only what the drawing asks her for.
function fagi(x, y, angle, extra = {}) {
  return { x, y, angle, alive: true, stride: 0, targetKind: null, castSide: 1,
    carrying: null, sex: 'female', temperature: 24, hunger: 10, thirst: 10, energy: 90,
    thermalStress: 0, age: 0, thought: { action: 'explore' }, ...extra };
}

function critter(f, scaleOf, t, label) {
  ctx.save();
  ctx.translate(f.x, f.y);
  ctx.scale(scaleOf, scaleOf);
  ctx.translate(-f.x, -f.y);
  drawFagi(ctx, { ...f, stride: f.alive ? t * 9 : 0, age: t });
  ctx.restore();
  if (label) { ctx.fillStyle = '#cfd3dc'; ctx.textAlign = 'center'; ctx.fillText(label, f.x, f.y + 13 * scaleOf + 8); }
}

// #close: one female and one male up close, to judge the detail.
const close = location.hash === '#close' || location.hash === '#macro';
const macro = location.hash === '#macro';

function frame(ms) {
  const t = ms / 1000;
  if (close) {
    ground();
    if (macro) critter(fagi(560, 350, 0), 34, t);
    else {
      critter(fagi(330, 350, -0.25), 17, t);
      critter(fagi(900, 350, 0.25, { sex: 'male' }), 12, t);
    }
    requestAnimationFrame(frame);
    return;
  }
  ground();

  // Big, female and male, to look at the shape.
  critter(fagi(170, 170, 0), 6, t, 'female');
  critter(fagi(440, 170, 0, { sex: 'male' }), 6, t, 'male');
  // Turning: the light has to stay fixed in the world.
  for (let i = 0; i < 6; i++) {
    critter(fagi(700 + (i % 3) * 150, 110 + ((i / 3) | 0) * 140, (i / 6) * Math.PI * 2, { sex: i % 2 ? 'male' : 'female' }), 2.4, t);
  }
  // Cold, hot, failing, asleep, carrying, tracking, dead.
  const row = 420;
  critter(fagi(90, row, 0.3, { temperature: 9, thermalFeel: 'cold' }), 3.2, t, 'cold');
  critter(fagi(250, row, 0.3, { temperature: 36, thermalFeel: 'heat' }), 3.2, t, 'hot');
  critter(fagi(410, row, 0.3, { hunger: 85, energy: 20 }), 3.2, t, 'failing');
  critter(fagi(570, row, 0.3, { thought: { action: 'rest' } }), 3.2, t, 'asleep');
  critter(fagi(730, row, -0.6, { carrying: { type: 'nectar' } }), 3.2, t, 'carrying');
  critter(fagi(890, row, 0.2, { targetKind: 'scent', castSide: 1 }), 3.2, t, 'tracking');
  critter(fagi(1050, row, 0.9, { alive: false }), 3.2, t, 'dead');
  // Life stages (LIFE): juvenile, adult, old.
  critter(fagi(800, 630, 0.2, { lifeStage: 'juvenile' }), 2.4, t, 'juvenile');
  critter(fagi(900, 630, 0.2), 2.4, t, 'adult');
  critter(fagi(1000, 630, 0.2, { lifeStage: 'senescent' }), 2.4, t, 'old');

  // Hunger empties the gaster; a male side by side with a female.
  critter(fagi(120, 630, 0.4, { hunger: 0 }), 2.4, t, 'fed');
  critter(fagi(300, 630, 0.4, { hunger: 95 }), 2.4, t, 'starving');
  critter(fagi(480, 630, 0.4, { sex: 'male', hunger: 0 }), 2.4, t, 'male fed');
  // And at real size, which is how she looks on the map.
  critter(fagi(1100, 630, 0.2), 1, t, 'real size');
  critter(fagi(1140, 630, 2.4, { sex: 'male' }), 1, t);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
