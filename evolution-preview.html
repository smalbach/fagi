<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>evolution preview</title>
<link rel="stylesheet" href="/src/styles/index.css" />
<body style="margin:0;background:#14161c">
<button id="btn-evolution">📈 Evolución</button> <span id="status" style="color:#8a90a2;font:12px system-ui"></span>
<div id="evolution-overlay" hidden>
  <div id="evolution-modal">
    <header><h2>📈 Cómo evolucionan las colonias</h2><button id="btn-evo-close" type="button">Cerrar</button></header>
    <div id="evolution-body"></div>
  </div>
</div>
<script type="module">
// A dev preview of the evolution panel without signing in: the game's world,
// three colonies, simulated fast for a few years (?years=N, ?lang=en).
import '/src/app/organism-on.js';
import { createWorld } from '/src/world.js';
import { generateMap } from '/src/mapgen.js';
import { stepWorld } from '/src/simulation.js';
import { createColony, updateColony } from '/src/colony.js';
import { recordEvolution } from '/src/evolution.js';
import { LIFE, SEASONS } from '/src/config.js';
import { setLang } from '/src/i18n.js';
import { createEvolutionModal } from '/src/evolution-modal.js';

const q = new URLSearchParams(location.search);
setLang?.(q.get('lang') ?? 'es');
const years = Number(q.get('years') ?? 2);
const world = createWorld();
generateMap(world);
const colony = createColony(LIFE.founders);
world.colony = colony;
const modal = createEvolutionModal(() => world);
const status = document.getElementById('status');
modal.open();
function chunk() {
  const until = Math.min(world.time + 60, years * SEASONS.year);
  while (world.time < until) {
    stepWorld(world, 0.1);
    updateColony(world, colony, 0.1);
    recordEvolution(world);
  }
  status.textContent = `año ${(world.time / SEASONS.year).toFixed(2)} de ${years}`;
  modal.update();
  if (world.time < years * SEASONS.year) setTimeout(chunk, 0);
  else { status.textContent += ' · listo'; modal.update(true); window.previewDone = true; }
}
chunk();
</script>
